<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <base href="/" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Nerf map studio</title>
    <style>
      body {
        margin: 0;
        background: #101713;
        color: #fff;
        font: 14px system-ui;
      }
      canvas {
        display: block;
      }
      aside {
        position: fixed;
        left: 18px;
        top: 18px;
        padding: 14px;
        background: #101713dd;
        border-radius: 8px;
        max-width: 410px;
      }
      button,
      select {
        font: inherit;
        padding: 7px;
        margin: 3px;
        background: #26352b;
        color: white;
        border: 1px solid #58695d;
        border-radius: 4px;
      }
      p {
        margin: 8px 3px;
        font-size: 12px;
        line-height: 1.5;
      }
      #stats {
        font-variant-numeric: tabular-nums;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <aside>
      <select id="map" aria-label="Map">
        <option value="canopy">Canopy</option>
        <option value="olympus">Olympus Mons</option>
        <option value="reef">Sunken Reef</option>
        <option value="mycelium">Mycelium Grove</option>
        <option value="arena">Blast Complex</option>
        <option value="fortress">Fortress Falls</option>
        <option value="city">Neon Heights</option>
        <option value="orrery">The Orrery</option><option value="asteroids">Asteroid Belt</option>
        <option value="bloom">Infinite Bloom</option>
        <option value="solar">Solar Flare</option></select
      ><span id="views"></span><button id="motion">Animate</button>
      <p>
        Drag to orbit, right drag to pan, scroll to move closer. Actual map
        geometry and collision, without combat or postprocessing.
      </p>
      <p id="stats">Loading textures…</p>
    </aside>
    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { MAPS, texturesReady } from "/src/maps.js";
      import { triangleMeshSurfaceY, pointHitsWorld } from "/src/engine.js";
      import { auditEnvironment } from "/tools/map-audit.js";
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(1);
      renderer.setSize(innerWidth, innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      document.body.append(renderer.domElement);
      const camera = new THREE.PerspectiveCamera(
        65,
        innerWidth / innerHeight,
        0.1,
        2000,
      );
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      const views = {
        orrery: {
          Overview: [[91,58,93],[0,16,0]],
          Arrival: [[5,2.2,52],[0,28,0]],
          Sanctuary: [[-6,2.2,-12],[2,25,7]],
          Archive: [[-6,2.3,-47],[8,3.3,-55]],
          Engine: [[-46,2.5,-11],[-55,3,5]],
          Crossing: [[45,12.3,4],[0,17,0]],
          Balcony: [[12.7,12.1,6],[0,36,0]],
          Underside: [[73,-13,57],[0,16,0]],
        },
        asteroids: {
          Overview: [
            [103, 67, 104],
            [0, 6, 0],
          ],
          Station: [
            [-24, 19, 25],
            [0, 11, -3],
          ],
          Cabin: [
            [0, 10.6, 1],
            [0, 11, -8],
          ],
          Rocks: [
            [-57, 22, 23],
            [-65, 8, -15],
          ],
          Cave: [
            [13, 18, -27],
            [0, 14, -44],
          ],
        },
        bloom: {
          Overview: [
            [28, 30, 38],
            [0, 0, 0],
          ],
          Inward: [
            [9, 1, 0],
            [0, 0, 0],
          ],
          Outward: [
            [33, 1.6, 0],
            [95, 1, 0],
          ],
        },
        solar: {
          Overview: [
            [91, 62, 94],
            [20, 5, 5],
          ],
          Operations: [
            [-10, 2.4, -9],
            [-2, 3, 8],
          ],
          Science: [
            [26, 2.3, 32],
            [39, 2.5, 21],
          ],
          Bridge: [
            [32, 9.6, -7],
            [45, 10, 3],
          ],
          Passage: [
            [8, 2, 16],
            [8, 2, 27],
          ],
        },
        city: {
          Circuit: [
            [0, 175, 100],
            [0, 0, 0],
          ],
          Overview: [
            [80, 65, 89],
            [0, 10, 0],
          ],
          Street: [
            [-37, 3, 15],
            [13, 12, -2],
          ],
          Station: [
            [-18, 15, 18],
            [0, 11, 0],
          ],
          Skyline: [
            [-63, 30, -11],
            [7, 23, 13],
          ],
          Subway: [
            [-27, -3, -9],
            [19, -4, -4],
          ],
          East: [
            [64, 15, 14],
            [34, 13, -8],
          ],
        },
        fortress: {
          Overview: [
            [98, 62, 74],
            [0, 5, 0],
          ],
          Keep: [
            [28, 12, 13],
            [0, 14, 27],
          ],
          Canal: [
            [-30, 2, 7],
            [15, 3, 0],
          ],
        },
        mycelium: {
          Overview: [
            [64, 34, 66],
            [0, 11, 0],
          ],
          Grove: [
            [14, 3, 19],
            [-12, 11, -18],
          ],
          Branches: [
            [-30, 17, 31],
            [0, 13, 8],
          ],
          Pond: [
            [23, 5, -18],
            [0, 6, -54],
          ],
        },
        arena: {
          Overview: [
            [-18, 12, 22],
            [2, 8, -7],
          ],
          Training: [
            [-72, 3, -7],
            [-42, 3, -38],
          ],
          Coolant: [
            [33, -2, 24],
            [62, 1, -10],
          ],
          Gallery: [
            [-67, 8, 42],
            [-31, 5, 18],
          ],
        },
        canopy: {
          Tunnel: [
            [54, 2.5, 34],
            [54, -0.8, 44],
          ],
          Overview: [
            [110, 82, 105],
            [0, 18, 0],
          ],
          River: [
            [-63, 4, -65],
            [-53, 0, -23],
          ],
          Village: [
            [27, 35, 32],
            [0, 30, 0],
          ],
          Ground: [
            [29, 3, 39],
            [0, 13, 0],
          ],
        },
        olympus: {
          Lava: [
            [153, 3, 94],
            [270, -1, 94],
          ],
          Vines: [
            [7, 77, 6],
            [24, 71, -12],
          ],
          Overview: [
            [190, 145, 205],
            [0, 51, 0],
          ],
          Court: [
            [16, 63, 25],
            [0, 81, -9],
          ],
          LightCourt: [
            [0, 93, 26],
            [0, 79, 8],
          ],
          Hades: [
            [25, 4, 18],
            [0, 20, -33],
          ],
          Mountain: [
            [134, 9, 112],
            [0, 52, 0],
          ],
        },
        reef: {
          Overview: [
            [102, 20, 120],
            [0, -17, 0],
          ],
          Dive: [
            [-60, -18, 16],
            [-23, -28, -28],
          ],
          Coral: [
            [28, -18, 52],
            [4, -28, 17],
          ],
        },
      };
      let frozenTime = 7;
      document.querySelector("#motion").onclick = (e) => {
        frozenTime = frozenTime === null ? world._t : null;
        e.target.textContent = frozenTime === null ? "Freeze" : "Animate";
      };
      let scene,
        world,
        mapId,
        frame = 0,
        elapsed = 0,
        last = performance.now();
      function view(name) {
        const [p, t] = views[mapId][name];
        camera.position.fromArray(p);
        controls.target.fromArray(t);
        controls.update();
      }
      async function load(id) {
        document.querySelector("#stats").textContent = "Building…";
        await texturesReady;
        if (scene) {
          world.dispose?.();
          const geometries = new Set();
          scene.traverse((o) => {
            if (o.geometry) geometries.add(o.geometry);
          });
          for (const g of geometries)
            g.dispose(); /* Some materials are shared by map factories. Keep them for repeat comparisons. */
        }
        document.querySelector("#map").value = id;
        scene = new THREE.Scene();
        world = MAPS.find((m) => m.id === id).build(scene);
        mapId = id;
        renderer.toneMappingExposure = world.toneMappingExposure || 1;
        document.querySelector("#views").replaceChildren(
          ...Object.keys(views[id]).map((name) => {
            const b = document.createElement("button");
            b.textContent = name;
            b.onclick = () => view(name);
            return b;
          }),
        );
        view("Overview");
        window.studio = {
          scene,
          world,
          camera,
          renderer,
          view,
          load,
          THREE,
          triangleMeshSurfaceY,
          pointHitsWorld,
          freezeAt: (t) => {
            frozenTime = t;
          },
          audit: () => auditEnvironment(scene, world, id),
          stats: () => ({
            map: id,
            calls: renderer.info.render.calls,
            triangles: renderer.info.render.triangles,
            colliders: world.colliders.length,
            issues: world.visualSurfaceIssues.length,
            meshes: (() => {
              let n = 0;
              scene.traverse((o) => {
                if (o.isMesh) n++;
              });
              return n;
            })(),
          }),
        };
      }
      document.querySelector("#map").onchange = (e) => load(e.target.value);
      await load(new URLSearchParams(location.search).get("map") || "canopy");
      renderer.setAnimationLoop(() => {
        const now = performance.now(),
          dt = Math.min((now - last) / 1000, 0.05);
        last = now;
        if (frozenTime === null) world.update(dt, []);
        else {
          world._t = frozenTime;
          world.update(0, []);
        }
        controls.update();
        world.beforeRender?.({ camera });
        renderer.render(scene, camera);
        frame++;
        elapsed += dt;
        if (elapsed > 1) {
          const s = window.studio.stats();
          document.querySelector("#stats").textContent =
            `${Math.round(frame / elapsed)} fps · ${s.calls} draws · ${s.triangles.toLocaleString()} triangles · ${s.colliders} colliders · ${s.issues} surface conflicts`;
          frame = 0;
          elapsed = 0;
        }
      });
      addEventListener("resize", () => {
        renderer.setSize(innerWidth, innerHeight);
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
      });
    </script>
  </body>
</html>
